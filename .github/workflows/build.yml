name: Build HarmonyOS HAP

on:
  workflow_dispatch:
    inputs:
      clt_url:
        description: 'commandline-tools Linux zip 直链（留空则用仓库变量）'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths: ['**/*.ets', '**/*.json5', '**/*.ts', '.github/workflows/*.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2.2GB 工具链缓存（直链更新时手动删缓存即可）
      - name: Cache commandline-tools
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/harmonyos
          key: clt-commandline-tools-linux-x64-26.0.0.865
          restore-keys: clt-
        # 任务失败也保存缓存，加速迭代
        save-always: true

      - name: Resolve commandline-tools URL
        id: url
        run: |
          set -e
          URL="${{ github.event.inputs.clt_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.COMMANDLINE_TOOLS_URL }}"
          fi
          echo "Using URL: ${URL:0:80}..."
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Download & unzip commandline-tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p "$HOME/harmonyos" && cd "$HOME/harmonyos"
          if [ ! -f clt.zip ]; then
            for i in 1 2 3; do
              curl -fL --retry 3 -o clt.zip "${{ steps.url.outputs.url }}" && break
              echo "download failed, attempt $i"; sleep 5
              if [ "$i" = "3" ]; then exit 1; fi
            done
          fi
          if [ ! -d command-line-tools ]; then
            unzip -q clt.zip
          fi
          ls -la

      - name: Setup env (always)
        run: |
          set -e
          cd "$HOME/harmonyos"
          ROOT=$(find . -maxdepth 1 -type d \( -name 'commandline-tools*' -o -name 'command-line-tools*' \) | head -1)
          echo "CLT_ROOT=$PWD/$ROOT" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$PWD/$ROOT/sdk" >> "$GITHUB_ENV"
          echo "HDC_HOME=$PWD/$ROOT/sdk/default/openharmony/toolchains" >> "$GITHUB_ENV"
          chmod +x "$ROOT/bin/"* 2>/dev/null || true
          chmod +x "$ROOT/tool/node/bin/"* 2>/dev/null || true
          echo "$PWD/$ROOT/bin" >> "$GITHUB_PATH"
          echo "$PWD/$ROOT/tool/node/bin" >> "$GITHUB_PATH"

      # hvigor 启动器强制要求用户目录存在 .npmrc（错误码 00303137）
      # @ohos 作用域包（hvigor 等）发布在 repo.harmonyos.com/npm/
      - name: Configure ~/.npmrc
        run: |
          cat > ~/.npmrc <<'NPMRC'
          registry=https://repo.huaweicloud.com/repository/npm/
          @ohos:registry=https://repo.harmonyos.com/npm/
          NPMRC
          cat ~/.npmrc

      - name: Verify toolchain
        run: |
          set -e
          node --version
          echo "DEVECO_SDK_HOME=$DEVECO_SDK_HOME"
          ls "$CLT_ROOT/bin" | head -10

      # SDK 版本事实诊断（适配配置用）
      - name: Dump SDK info
        run: |
          echo "--- sdk/default tree ---"
          find "$CLT_ROOT/sdk/default" -maxdepth 2 | head -30 || true
          echo "--- json metadata ---"
          find "$CLT_ROOT/sdk" -maxdepth 4 -name '*.json' | head -10 || true
          for f in $(find "$CLT_ROOT/sdk" -maxdepth 4 -name '*.json' | head -5); do
            echo "== $f =="; head -c 600 "$f"; echo
          done

      - name: Build HAP (debug, unsigned)
        run: |
          set -e
          hvigorw assembleHap --mode module -p product=default --no-daemon
          echo "---- outputs ----"
          find . -name '*.hap' | head -20

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: aquaheat-hap
          path: |
            entry/build/**/outputs/**/*.hap
          if-no-files-found: error
          retention-days: 30
